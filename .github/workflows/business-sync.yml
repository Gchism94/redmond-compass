# Main Redmond Compass directory → app database. The public main-site feed is the shared
# publication boundary; the app mirrors it by stable business id every six hours.
name: main-site-business-sync
on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch: {}
concurrency: main-site-business-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify business mapping and hours parsing before writes
        run: npm run test:business-sync
      - name: Preview the live reconciliation
        run: node scripts/sync-main-site-businesses.mjs --dry-run
        env:
          SUPABASE_URL: https://jdrhcmkqtewlzlojixpd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Mirror published businesses into Supabase
        run: node scripts/sync-main-site-businesses.mjs
        env:
          SUPABASE_URL: https://jdrhcmkqtewlzlojixpd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

